                        <button class="task-detail-button ${isCompleted ? 'completed' : ''}" 
                                ${isCompleted ? 'disabled' : ''} 
                                onclick="markTaskAsCompleted('${taskId}')">
                            ${isCompleted ? 'Task Completed' : 'Mark as Completed'}
                        </button>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading task detail:', error);
                content.innerHTML = '<div class="empty-state">Error loading task details</div>';
            }
        };

        // Mark task as completed
        window.markTaskAsCompleted = async function(taskId) {
            try {
                await fetch(`${BACKEND_URL}/api/tasks/${taskId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'completed' })
                });
                // Reload task detail
                await showTaskDetail(taskId);
                // Reload tasks list
                await loadTasks();
                showNotification('Task marked as completed', 2000);
            } catch (error) {
                console.error('Error marking task as completed:', error);
                showNotification('Error updating task', 3000);
            }
        };

        // Load Summarization
        async function loadSummarization() {
            const content = document.getElementById('summarizationContent');
            content.innerHTML = '<div class="empty-state">Loading summary...</div>';

            try {
                const activeMeetingRes = await fetch(`${BACKEND_URL}/api/meetings/active`);
                const activeMeetingData = await activeMeetingRes.json();
                
                if (!activeMeetingData.meeting_id) {
                    content.innerHTML = '<div class="empty-state">No active meeting</div>';
                    return;
                }

                const summaryRes = await fetch(`${BACKEND_URL}/api/meetings/${activeMeetingData.meeting_id}/summary`);
                const summaryData = await summaryRes.json();
                
                const summary = summaryData.summary || 'Summary will be available shortly...';
                content.innerHTML = `<div class="summary-content">${summary}</div>`;
            } catch (error) {
                console.error('Error loading summary:', error);
                content.innerHTML = '<div class="empty-state">Error loading summary</div>';
            }
        }

        // Load History
        async function loadHistory() {
            const content = document.getElementById('historyContent');
            content.innerHTML = '<div class="empty-state">Loading history...</div>';

            try {
                const meetingsRes = await fetch(`${BACKEND_URL}/api/meetings`);
                const meetingsData = await meetingsRes.json();
                const meetings = meetingsData.meetings || [];

                if (meetings.length === 0) {
                    content.innerHTML = '<div class="empty-state">No meetings found</div>';
                    return;
                }

                content.innerHTML = `
                    <div class="history-list">
                        ${meetings.map(meeting => {
                            // Use the meeting title from API, or fallback to a default
                            const title = meeting.title || `Meeting ${new Date(meeting.start_time).toLocaleDateString()}`;
                            return `
                                <div class="history-item" onclick="showMeetingDetail('${meeting.meeting_id}')">
                                    <div class="history-item-title">${title}</div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('Error loading history:', error);
                content.innerHTML = '<div class="empty-state">Error loading history</div>';
            }
        }

        // Store selected voice for current meeting
        let selectedVoiceId = null;
        let availableVoices = [];

        // Helper function to escape HTML entities
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Function to get emotion for a voice - assigns unique emotion based on index
        function getVoiceEmotion(index) {
            // Exactly 20 unique emotions for 20 voices
            const emotions = [
                'Happy', 'Calm', 'Excited', 'Professional', 'Friendly',
                'Confident', 'Playful', 'Thoughtful', 'Energetic', 'Warm',
                'Smooth', 'Bold', 'Gentle', 'Passionate', 'Cool',
                'Elegant', 'Enthusiastic', 'Soothing', 'Charismatic', 'Sincere'
            ];
            
            // Use index to assign emotion, wrap around if more than 20 voices
            return emotions[index % emotions.length];
        }

        // Show meeting detail
        window.showMeetingDetail = async function(meetingId) {
            const content = document.getElementById('meetingDetailContent');
            content.innerHTML = '<div class="empty-state">Loading meeting details...</div>';
            // Determine which view opened this (could be historyView or taskDetailView)
            const fromView = currentView === historyView ? historyView : (currentView === taskDetailView ? taskDetailView : null);
            const button = currentView === historyView ? historyButton : (currentView === taskDetailView ? tasksButton : null);
            showView(meetingDetailView, button, fromView);

            try {
                // Fetch meeting and voices in parallel
                const [meetingRes, voicesRes] = await Promise.all([
                    fetch(`${BACKEND_URL}/api/meetings/${meetingId}`),
                    fetch(`${BACKEND_URL}/api/voices`)
                ]);
                
                const meeting = await meetingRes.json();
                const voicesData = await voicesRes.json();
                const voices = voicesData.voices || [];
                availableVoices = voices; // Store voices for random selection
                
                // Reset and set default to random voice for this meeting
                selectedVoiceId = null;
                if (voices.length > 0) {
                    // Select a random voice
                    const randomIndex = Math.floor(Math.random() * voices.length);
                    selectedVoiceId = voices[randomIndex].voice_id;
                }
                
                const title = meeting.title || `Meeting ${new Date(meeting.start_time).toLocaleString()}`;
                const summary = meeting.summary || 'No summary available';
                let transcriptVisible = false;

                // Update header text
                const headerText = document.getElementById('meetingDetailHeader');
                if (headerText) {
                    headerText.textContent = title;
                }
                
                // Get current selected voice info
                const currentVoice = voices.find(v => v.voice_id === selectedVoiceId) || voices[0];
                const currentBitmojiUrl = currentVoice ? (currentVoice.bitmoji_url || currentVoice.emoji) : '🎲';
                const currentVoiceName = currentVoice ? (currentVoice.name || 'Random Voice') : 'Random Voice';
                const currentVoiceDescription = currentVoice ? (currentVoice.description || 'No description available') : 'No description available';
                
                content.innerHTML = `
                    <div class="meeting-detail">
                        <div class="meeting-detail-summary">${summary}</div>
                        <div class="personality-selector">
                            <label class="personality-selector-label">Voice Personality:</label>
                            <div class="personality-buttons">
                                <button class="personality-button random-voice-button" 
                                        data-voice-name="${escapeHtml(currentVoiceName)}" 
                                        data-voice-description="${escapeHtml(currentVoiceDescription)}"
                                        onclick="showVoiceDescriptionFromButton(this)">
                                    ${currentBitmojiUrl.startsWith('http') ? `<img src="${currentBitmojiUrl}" alt="${escapeHtml(currentVoiceName)}" class="bitmoji-avatar" />` : currentBitmojiUrl}
                                    <span class="random-voice-label">${escapeHtml(currentVoiceName)}</span>
                                </button>
                                <button class="random-voice-change-button" onclick="selectRandomVoice()" title="Change to random voice">
                                    🎲 Random
                                </button>
                            </div>
                        </div>
                        <div class="audio-buttons-group">
                            <button class="audio-button" id="audioSummaryButton" onclick="generateAudio('${meetingId}', 'summary', this)">
                                🎙️ Listen to Summary
                            </button>
                            <button class="audio-button" id="audioTranscriptButton" onclick="generateAudio('${meetingId}', 'transcript', this)">
                                🎙️ Listen to Transcript
                            </button>
                            <button class="transcript-button" onclick="toggleTranscript('${meetingId}', this)">
                                ${transcriptVisible ? 'Hide' : 'Show'} Transcript
                            </button>
                        </div>
                        <div class="audio-player-container" id="audioPlayerContainer">
                            <audio class="audio-player" id="audioPlayer" controls></audio>
                            <div class="audio-player-info" id="audioPlayerInfo"></div>
                        </div>
                        <div id="transcriptContainer" style="display: none;">
                            <div class="transcript-content" id="transcriptContent"></div>
                        </div>
                    </div>
                `;
                
            } catch (error) {
                console.error('Error loading meeting detail:', error);
                content.innerHTML = '<div class="empty-state">Error loading meeting details</div>';
            }
        };

        // Select random voice
        window.selectRandomVoice = function() {
            if (availableVoices.length === 0) {
                console.warn('No voices available');
                return;
            }
            
            // Select a random voice
            const randomIndex = Math.floor(Math.random() * availableVoices.length);
            const randomVoice = availableVoices[randomIndex];
            selectedVoiceId = randomVoice.voice_id;
            
            // Update the display
            const button = document.querySelector('.random-voice-button');
            if (button) {
                const bitmojiUrl = randomVoice.bitmoji_url || randomVoice.emoji;
                const voiceName = randomVoice.name || 'Random Voice';
                const voiceDescription = randomVoice.description || 'No description available';
                
                // Update button content and data attributes
                if (bitmojiUrl.startsWith('http')) {
                    button.innerHTML = `<img src="${bitmojiUrl}" alt="${escapeHtml(voiceName)}" class="bitmoji-avatar" /><span class="random-voice-label">${escapeHtml(voiceName)}</span>`;
                } else {
                    button.innerHTML = `${bitmojiUrl}<span class="random-voice-label">${escapeHtml(voiceName)}</span>`;
                }
                button.setAttribute('data-voice-name', escapeHtml(voiceName));
                button.setAttribute('data-voice-description', escapeHtml(voiceDescription));
            }
        };

        // Show voice description from button data attributes
        window.showVoiceDescriptionFromButton = function(button) {
            const voiceName = button.getAttribute('data-voice-name') || 'Unknown Voice';
            const voiceDescription = button.getAttribute('data-voice-description') || 'No description available';
            showVoiceDescription(voiceName, voiceDescription, button);
        };

        // Show voice description
        window.showVoiceDescription = function(voiceName, voiceDescription, buttonElement) {
            // Remove any existing modal first
            const existingModal = document.querySelector('.voice-description-modal');
            if (existingModal) {
                existingModal.remove();
            }
            
            // Get button position
            const buttonRect = buttonElement.getBoundingClientRect();
            
            // Create modal overlay (transparent background, just for click-outside detection)
            const modal = document.createElement('div');
            modal.className = 'voice-description-modal';
            
            // Create content div
            const content = document.createElement('div');
            content.className = 'voice-description-content';
            content.innerHTML = `
                <div class="voice-description-header">
                    <h3>${escapeHtml(voiceName)}</h3>
                    <button class="voice-description-close" onclick="this.closest('.voice-description-modal').remove()">×</button>
                </div>
                <div class="voice-description-body">
                    <p>${escapeHtml(voiceDescription)}</p>
                </div>
            `;
            
            // Position content above the button
            const spacing = 12; // Space between button and modal
            const contentWidth = 400; // Approximate width, will be adjusted
            
            modal.appendChild(content);
            document.body.appendChild(modal);
            
            // Adjust position after content is rendered to get actual dimensions
            setTimeout(() => {
                const actualWidth = content.offsetWidth;
                const actualHeight = content.offsetHeight;
                
                // Calculate horizontal position (centered on button)
                const left = buttonRect.left + (buttonRect.width / 2) - (actualWidth / 2);
                const adjustedLeft = Math.max(10, Math.min(left, window.innerWidth - actualWidth - 10));
                
                // Calculate vertical position (above button)
                const top = buttonRect.top - actualHeight - spacing;
                // If it would go off-screen at the top, position it below instead
                const adjustedTop = top < 10 ? buttonRect.bottom + spacing : top;
                
                content.style.left = adjustedLeft + 'px';
                content.style.top = adjustedTop + 'px';
                
                // Add arrow pointing to button (only if positioned above)
                if (adjustedTop < buttonRect.top) {
                    const arrow = document.createElement('div');
                    arrow.className = 'voice-description-arrow';
                    const arrowLeft = (buttonRect.left + buttonRect.width / 2) - adjustedLeft;
                    arrow.style.left = Math.max(20, Math.min(arrowLeft, actualWidth - 20)) + 'px';
                    content.appendChild(arrow);
                }
            }, 0);
            
            // Close on background click
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
        };

        // Toggle transcript
        window.toggleTranscript = async function(meetingId, button) {
            const container = document.getElementById('transcriptContainer');
            const transcriptContent = document.getElementById('transcriptContent');
            const isVisible = container.style.display !== 'none';

            if (isVisible) {
                container.style.display = 'none';
                button.textContent = 'Show Transcript';
            } else {
                container.style.display = 'block';
                button.textContent = 'Hide Transcript';
                
                if (!transcriptContent.innerHTML) {
                    try {
                        const transcriptRes = await fetch(`${BACKEND_URL}/api/meetings/${meetingId}/transcript`);
                        const transcriptData = await transcriptRes.json();
                        const transcript = transcriptData.transcript || [];

                        if (transcript.length === 0) {
                            transcriptContent.innerHTML = '<div class="empty-state">No transcript available</div>';
                        } else {
                            transcriptContent.innerHTML = transcript.map(segment => `
                                <div class="transcript-segment">
                                    <div class="transcript-segment-text">${segment.text || ''}</div>
                                </div>
                            `).join('');
                        }
                    } catch (error) {
                        console.error('Error loading transcript:', error);
                        transcriptContent.innerHTML = '<div class="empty-state">Error loading transcript</div>';
                    }
                }
            }
        };

        // Generate and play audio
        window.generateAudio = async function(meetingId, audioType, button) {
            const audioPlayerContainer = document.getElementById('audioPlayerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const audioPlayerInfo = document.getElementById('audioPlayerInfo');
            
            // Use selected voice or default to first
            const voiceId = selectedVoiceId || null;
            
            // Show loading state
            button.disabled = true;
            button.classList.add('loading');
            const originalText = button.innerHTML;
            button.innerHTML = audioType === 'summary' ? '🎙️ Generating Summary Audio...' : '🎙️ Generating Transcript Audio...';
            
            try {
                // Build URL with query parameters
                let url = `${BACKEND_URL}/api/meetings/${meetingId}/audio/generate?audio_type=${audioType}`;
                if (voiceId) {
                    url += `&voice_id=${voiceId}`;
                }
                
                // Call the backend to generate audio
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Failed to generate audio');
                }

                const data = await response.json();
                
                // Set audio source
                const audioUrl = `${BACKEND_URL}${data.audio_url}`;
                audioPlayer.src = audioUrl;
                
                // Show player and info
                audioPlayerContainer.classList.add('active');
                audioPlayerInfo.textContent = `Playing ${audioType === 'summary' ? 'summary' : 'transcript'} audio`;
                
                // Try to play audio
                try {
                    await audioPlayer.play();
                } catch (playError) {
                    console.warn('Auto-play prevented:', playError);
                    audioPlayerInfo.textContent = `Audio ready. Click play to listen to ${audioType === 'summary' ? 'summary' : 'transcript'}.`;
                }
                
                showNotification(`${audioType === 'summary' ? 'Summary' : 'Transcript'} audio generated successfully`, 3000);
                
            } catch (error) {
                console.error('Error generating audio:', error);
                showNotification(`Error generating audio: ${error.message}`, 5000);
                audioPlayerContainer.classList.remove('active');
            } finally {
                // Reset button state
                button.disabled = false;
                button.classList.remove('loading');
                button.innerHTML = originalText;
            }
        };

        // Load Settings
        async function loadSettings() {
            const content = document.getElementById('settingsContent');
            content.innerHTML = '<div class="empty-state">Loading settings...</div>';

            try {
                const settingsRes = await fetch(`${BACKEND_URL}/api/settings/${USER_ID}`);
                const settings = await settingsRes.json();

                const preferredLanguage = settings.preferred_language || '';
                const spokenLanguages = settings.spoken_languages || [];

                // Load subtitles preference from localStorage (default to true)
                const subtitlesEnabled = localStorage.getItem('subtitlesEnabled') !== 'false';

                content.innerHTML = `
                    <form class="settings-form" onsubmit="saveSettings(event)">
                        <div class="settings-field">
                            <button type="button" class="subtitles-toggle-button" onclick="toggleSubtitlesButton()">
                                ${subtitlesEnabled ? 'Turn off Subtitles' : 'Turn on Subtitles'}
                            </button>
                        </div>
                        <div class="settings-field">
                            <label>Preferred Language</label>
                            <select id="preferredLanguage">
                                <option value="">Select language</option>
                                <option value="en" ${preferredLanguage === 'en' ? 'selected' : ''}>English</option>
                                <option value="pt" ${preferredLanguage === 'pt' ? 'selected' : ''}>Portuguese</option>
                                <option value="es" ${preferredLanguage === 'es' ? 'selected' : ''}>Spanish</option>
                                <option value="fr" ${preferredLanguage === 'fr' ? 'selected' : ''}>French</option>
                                <option value="de" ${preferredLanguage === 'de' ? 'selected' : ''}>German</option>
                                <option value="it" ${preferredLanguage === 'it' ? 'selected' : ''}>Italian</option>
                                <option value="ja" ${preferredLanguage === 'ja' ? 'selected' : ''}>Japanese</option>
                                <option value="zh" ${preferredLanguage === 'zh' ? 'selected' : ''}>Chinese</option>
                                <option value="ko" ${preferredLanguage === 'ko' ? 'selected' : ''}>Korean</option>
                            </select>
                        </div>
                        <div class="settings-field">
                            <label>Spoken Languages</label>
                            <div class="language-tags" id="languageTags">
                                ${spokenLanguages.map(lang => `
                                    <span class="language-tag">
                                        ${lang}
                                        <span class="language-tag-remove" onclick="removeLanguage('${lang}')">×</span>
                                    </span>
                                `).join('')}
                            </div>
                            <div class="add-language-input">
                                <select id="newLanguage">
                                    <option value="">Add language</option>
                                    <option value="en">English</option>
                                    <option value="pt">Portuguese</option>
                                    <option value="es">Spanish</option>
                                    <option value="fr">French</option>
                                    <option value="de">German</option>
                                    <option value="it">Italian</option>
                                    <option value="ja">Japanese</option>
                                    <option value="zh">Chinese</option>
                                    <option value="ko">Korean</option>
                                </select>
                                <button type="button" class="add-language-button" onclick="addLanguage()">Add</button>
                            </div>
                        </div>
                        <button type="submit" class="save-button">Save Settings</button>
                    </form>
                `;
            } catch (error) {
                console.error('Error loading settings:', error);
                content.innerHTML = '<div class="empty-state">Error loading settings</div>';
            }
        }

        // Add language
        window.addLanguage = function() {
            const select = document.getElementById('newLanguage');
            const lang = select.value;
            if (!lang) return;

            const tags = document.getElementById('languageTags');
            const existingLangs = Array.from(tags.querySelectorAll('.language-tag')).map(tag => 
                tag.textContent.trim().split('×')[0].trim()
            );

            if (existingLangs.includes(lang)) {
                showNotification('Language already added', 2000);
                return;
            }

            const tag = document.createElement('span');
            tag.className = 'language-tag';
            tag.innerHTML = `${lang} <span class="language-tag-remove" onclick="removeLanguage('${lang}')">×</span>`;
            tags.appendChild(tag);
            select.value = '';
        };

        // Remove language
        window.removeLanguage = function(lang) {
            const tags = document.getElementById('languageTags');
            const tagElements = tags.querySelectorAll('.language-tag');
            tagElements.forEach(tag => {
                if (tag.textContent.includes(lang)) {
                    tag.remove();
                }
            });
        };

        // Check if subtitles are enabled
        function areSubtitlesEnabled() {
            return localStorage.getItem('subtitlesEnabled') !== 'false';
        }

        // Toggle subtitles button
        window.toggleSubtitlesButton = function() {
            const currentState = areSubtitlesEnabled();
            const newState = !currentState;
            
            // Save preference to localStorage
            localStorage.setItem('subtitlesEnabled', newState);
            
            // Update button text
            const button = document.querySelector('.subtitles-toggle-button');
            if (button) {
                button.textContent = newState ? 'Turn off Subtitles' : 'Turn on Subtitles';
            }
            
            // Apply the preference - only hide if disabled, don't force show if enabled
            // (let the existing content-based logic handle showing)
            const transcriptDiv = document.getElementById('transcript');
            if (transcriptDiv && !newState) {
                // If disabling, hide immediately
                transcriptDiv.classList.add('hidden');
            }
            // If enabling, don't force show - let content-based logic handle it
        };

        // Apply subtitles preference on page load
        function applySubtitlesPreference() {
            const subtitlesEnabled = areSubtitlesEnabled();
            const transcriptDiv = document.getElementById('transcript');
            if (transcriptDiv && !subtitlesEnabled) {
                // Only hide if disabled, don't force show if enabled
                transcriptDiv.classList.add('hidden');
            }
        }

        // Save settings
        window.saveSettings = async function(event) {
            event.preventDefault();
            
            const preferredLanguage = document.getElementById('preferredLanguage').value;
            const tags = document.getElementById('languageTags');
            const spokenLanguages = Array.from(tags.querySelectorAll('.language-tag')).map(tag => 
                tag.textContent.trim().split('×')[0].trim()
            );

            try {
                const response = await fetch(`${BACKEND_URL}/api/settings/${USER_ID}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        preferred_language: preferredLanguage || null,
                        spoken_languages: spokenLanguages
                    })
                });

                if (response.ok) {
                    showNotification('Settings saved successfully', 3000);
                    hideAllViews();
                } else {
                    throw new Error('Failed to save settings');
                }
            } catch (error) {
                console.error('Error saving settings:', error);
                showNotification('Error saving settings', 3000);
            }
        };

        // Update menu buttons when AI toggle changes
        aiToggle.addEventListener('change', () => {
            updateMenuButtonsVisibility();
        });

        // Initialize menu buttons visibility
        updateMenuButtonsVisibility();

        // Close controls
        window.closeControls = function() {
            document.getElementById('controls').style.display = 'none';
        };

        // Close transcript
        window.closeTranscript = function() {
            transcriptDiv.classList.add('hidden');
        };

        // Close view
        window.closeView = function(viewId) {
            const view = document.getElementById(viewId);
            if (view) {
                hideAllViews(true);
            }
        };
    </script>
</body>
</html>
